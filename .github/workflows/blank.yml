name: AnDos Ubuntu PC VIRTUAL

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: System Information
      shell: bash
      run: |
        echo "========================================"
        echo "        AnDos UBUNTU PC VIRTUAL"
        echo "========================================"
        echo "Instance: ${{ inputs.instance_number }}"
        echo "Runner: $RUNNER_NAME"
        echo ""

        echo "=== SISTEMA ==="
        uname -a
        echo ""

        echo "=== CPU ==="
        nproc
        lscpu | grep -E "Model name|CPU\(s\)" | head
        echo ""

        echo "=== RAM ==="
        free -h
        echo ""

        echo "=== DISCO ==="
        df -h /

    - name: Install Desktop and XRDP
      shell: bash
      run: |
        echo "=== INSTALANDO INTERFACE UBUNTU ==="

        sudo apt-get update

        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          xfce4 \
          xfce4-goodies \
          xrdp \
          dbus-x11 \
          xorgxrdp \
          curl \
          wget \
          unzip \
          git \
          htop

        echo "Interface gráfica instalada."

    - name: Configure XFCE
      shell: bash
      run: |
        echo "=== CONFIGURANDO XFCE ==="

        sudo bash -c 'cat > /etc/xrdp/startwm.sh << "EOF"
        #!/bin/sh

        export LANG=C.UTF-8
        export LANGUAGE=C.UTF-8
        export LC_ALL=C.UTF-8

        unset DBUS_SESSION_BUS_ADDRESS
        unset XDG_RUNTIME_DIR

        startxfce4
        EOF'

        sudo chmod +x /etc/xrdp/startwm.sh

        sudo systemctl enable xrdp
        sudo systemctl restart xrdp

        echo "XRDP configurado."

    - name: Create Linux User
      shell: bash
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      run: |
        echo "=== CRIANDO USUÁRIO ==="

        if [ -z "$RDP_PASSWORD" ]; then
          echo "ERRO: Secret RDP_PASSWORD não configurado."
          exit 1
        fi

        if id "andospc" >/dev/null 2>&1; then
          echo "Usuário já existe."
        else
          sudo useradd -m -s /bin/bash andospc
        fi

        echo "andospc:$RDP_PASSWORD" | sudo chpasswd

        sudo usermod -aG sudo andospc

        sudo bash -c 'cat > /home/andospc/.xsession << "EOF"
        startxfce4
        EOF'

        sudo chown andospc:andospc /home/andospc/.xsession
        sudo chmod +x /home/andospc/.xsession

        echo "Usuário Linux criado."

    - name: Install Tailscale
      shell: bash
      run: |
        echo "=== INSTALANDO TAILSCALE ==="

        curl -fsSL https://tailscale.com/install.sh | sh

        echo "Tailscale instalado."

    - name: Connect Tailscale
      shell: bash
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        echo "=== CONECTANDO TAILSCALE ==="

        if [ -z "$TAILSCALE_AUTH_KEY" ]; then
          echo "ERRO: Secret TAILSCALE_AUTH_KEY não configurado."
          exit 1
        fi

        sudo tailscale up \
          --authkey="$TAILSCALE_AUTH_KEY" \
          --hostname="andos-ubuntu-${{ github.run_id }}"

        sleep 10

        echo "Tailscale conectado."

    - name: Get Tailscale IP
      shell: bash
      run: |
        echo "=== OBTENDO IP ==="

        TS_IP=$(tailscale ip -4 | head -n 1)

        if [ -z "$TS_IP" ]; then
          echo "Não foi possível obter o IP Tailscale."
          exit 1
        fi

        echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

        echo ""
        echo "========================================"
        echo "        ANDOS UBUNTU RDP"
        echo "========================================"
        echo "HOST: $TS_IP"
        echo "USER: andospc"
        echo "PORT: 3389"
        echo "SISTEMA: Ubuntu Linux"
        echo "========================================"

    - name: Restart XRDP
      shell: bash
      run: |
        echo "=== INICIANDO XRDP ==="

        sudo systemctl restart xrdp

        sleep 5

        sudo systemctl status xrdp --no-pager || true

        echo "XRDP ativo."

    - name: Install Chrome
      shell: bash
      run: |
        echo "=== INSTALANDO GOOGLE CHROME ==="

        wget -q \
          https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
          -O /tmp/chrome.deb

        sudo apt-get install -y /tmp/chrome.deb

        rm -f /tmp/chrome.deb

        echo "Chrome instalado."

    - name: Connection Details
      shell: bash
      run: |
        echo ""
        echo "╔══════════════════════════════════════╗"
        echo "║        ANDOS UBUNTU PC VIRTUAL       ║"
        echo "╠══════════════════════════════════════╣"
        echo "║ Sistema: Ubuntu Linux                ║"
        echo "║ Host: $TAILSCALE_IP"
        echo "║ Usuário: andospc                    ║"
        echo "║ Porta: 3389                          ║"
        echo "║ Desktop: XFCE                        ║"
        echo "╚══════════════════════════════════════╝"
        echo ""

        echo "No celular:"
        echo ""
        echo "1. Abra o Tailscale"
        echo "2. Conecte ao mesmo Tailnet"
        echo "3. Abra um aplicativo de RDP"
        echo "4. PC: $TAILSCALE_IP"
        echo "5. Usuário: andospc"
        echo "6. Senha: valor do Secret RDP_PASSWORD"
        echo ""

    - name: Keep Session Alive
      shell: bash
      run: |
        echo ""
        echo "========================================"
        echo "       UBUNTU PC VIRTUAL ATIVO"
        echo "========================================"
        echo "Tempo máximo: 6 horas"
        echo ""

        counter=0

        while true
        do
          counter=$((counter + 1))

          echo "Heartbeat #$counter - $(date)"

          if tailscale status >/dev/null 2>&1
          then
            echo "Tailscale: ACTIVE"
          else
            echo "Tailscale: ERROR"
          fi

          if systemctl is-active --quiet xrdp
          then
            echo "XRDP: ACTIVE"
          else
            echo "XRDP: ERROR"
          fi

          echo ""

          sleep 60
        done
